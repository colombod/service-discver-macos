name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test
      - name: Package app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Service-Discovery-macOS
          path: dist/*.app
